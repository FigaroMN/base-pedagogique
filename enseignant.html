<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace Enseignant FigaroMN</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#1e2936;--muted:#627280;--navy:#405b78;--green:#456d55;--red:#8b4b45;--line:#d8e2e7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.shell{width:min(1160px,calc(100% - 30px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;text-decoration:none;color:var(--ink)}
.hero{padding:38px 0 16px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:.2rem 0}.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
label{font-weight:800}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #b8c7d0;border-radius:10px;margin-top:5px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.good{background:var(--green)}.btn.bad{background:var(--red)}.btn.light{background:#e7eef2;color:var(--ink)}
.msg{font-weight:800;margin-top:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5eef3;font-weight:850;font-size:.82rem}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#eaf0f3}
.period{background:#f8fafb;border:1px solid var(--line);border-radius:14px;padding:18px}.period h3{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head><body>
<header class="top"><div class="shell nav"><a class="brand" href="enseignant.html">🔐 Espace Enseignant</a><button class="btn bad" id="logout" type="button">Déconnexion</button></div></header>
<main class="shell"><section class="hero"><span class="pill">Tableau de bord</span><h1>Suivi des élèves</h1>
<p class="muted">Version simplifiée : rattachement, niveau, progression, notes et compétences.</p></section>

<section class="card"><h2>1 · Rattacher un élève</h2>
<div class="grid2"><label>Élève<select id="studentSelect"></select></label><label>Classe<select id="classSelect"></select></label></div>
<br><button class="btn good" id="assignBtn" type="button">Rattacher à la classe</button><div id="assignMsg" class="msg"></div></section>

<section class="card"><h2>2 · Mes élèves</h2>
<label>Classe<select id="filterClass"><option value="">Toutes mes classes</option></select></label>
<div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Élève</th><th>E-mail</th><th>Niveau</th><th>Classe</th><th>Progression</th><th>Moyenne évaluations</th></tr></thead><tbody id="studentRows"></tbody></table></div>
<div id="pageMsg" class="msg"></div></section>

<section class="card"><h2>3 · Observer une compétence</h2>
<div class="grid3">
<label>Élève<select id="obsStudent"></select></label>
<label>Compétence<select id="obsComp"></select></label>
<label>Niveau<select id="obsLevel"><option value="1">1 · Non acquis</option><option value="2">2 · En cours</option><option value="3">3 · Acquis</option><option value="4">4 · Maîtrisé</option></select></label>
</div><br>
<label>Preuve<textarea id="obsEvidence"></textarea></label><br>
<label>Commentaire / remédiation<textarea id="obsComment"></textarea></label><br>
<button class="btn good" id="saveObs" type="button">Enregistrer</button><div id="obsMsg" class="msg"></div></section>
</main>
<script src="supabase-config.js"></script><script src="figaromn-cloud.js"></script>
<script>
(async function(){
 const me=await FigaroCloud.requireRole("teacher"); if(!me)return;
 logout.onclick=async()=>{await FigaroCloud.signOut();location.href="bac-pro.html";};
 const requested=new URLSearchParams(location.search).get("level");

 const classes=await FigaroCloud.table("classes","teacher_id=eq."+me.id+"&select=id,name,level,school_year&order=name.asc");
 const classMap={}; classes.forEach(c=>classMap[c.id]=c);
 function fillClasses(sel,all){
   sel.innerHTML=(all?"<option value=''>Toutes mes classes</option>":"")+classes.map(c=>`<option value="${c.id}">${FigaroCloud.esc(c.name)}</option>`).join("");
 }
 fillClasses(classSelect,false); fillClasses(filterClass,true);
 if(requested){
   const c=classes.find(x=>x.level===requested);
   if(c){classSelect.value=c.id;filterClass.value=c.id;}
 }

 let profiles=[], memberships=[];
 async function reload(){
   profiles=await FigaroCloud.table("profiles","role=eq.student&select=id,full_name,email,level,archived_at&order=full_name.asc");
   memberships=await FigaroCloud.table("class_members","select=class_id,student_id");
   const active=profiles.filter(p=>!p.archived_at);
   studentSelect.innerHTML=active.map(p=>`<option value="${p.id}">${FigaroCloud.esc(p.full_name||p.email||p.id)}</option>`).join("");
   obsStudent.innerHTML=studentSelect.innerHTML;
   await render();
 }

 async function render(){
   const pmap={}, emap={};
   const prog=await FigaroCloud.table("session_progress","select=student_id,status");
   const evals=await FigaroCloud.table("evaluation_results","select=student_id,score");
   prog.forEach(x=>{const a=pmap[x.student_id]||(pmap[x.student_id]={n:0,d:0});a.n++;if(x.status==="completed")a.d++;});
   evals.forEach(x=>{(emap[x.student_id]||(emap[x.student_id]=[])).push(Number(x.score));});
   const mb={};memberships.forEach(m=>{(mb[m.student_id]||(mb[m.student_id]=[])).push(m.class_id);});
   const fc=filterClass.value;
   studentRows.innerHTML=profiles.filter(p=>!p.archived_at&&(!fc||(mb[p.id]||[]).includes(fc))).map(p=>{
     const cls=(mb[p.id]||[]).map(id=>classMap[id]&&classMap[id].name).filter(Boolean).join(", ");
     const pr=pmap[p.id]||{n:0,d:0}, notes=emap[p.id]||[];
     const avg=notes.length?(notes.reduce((a,b)=>a+b,0)/notes.length).toFixed(1):"—";
     return `<tr><td>${FigaroCloud.esc(p.full_name||"")}</td><td>${FigaroCloud.esc(p.email||"")}</td><td>${FigaroCloud.esc(p.level||"")}</td><td>${FigaroCloud.esc(cls||"Non rattaché")}</td><td>${pr.d} / ${pr.n}</td><td>${avg}</td></tr>`;
   }).join("")||"<tr><td colspan='6'>Aucun élève.</td></tr>";
 }
 filterClass.onchange=render;

 assignBtn.onclick=async function(){
   assignMsg.textContent="Enregistrement…";
   try{
     const sid=studentSelect.value,cid=classSelect.value,c=classMap[cid];
     await FigaroCloud.table("class_members","",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({class_id:cid,student_id:sid})});
     await FigaroCloud.table("profiles","id=eq."+sid,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({level:c.level})});
     assignMsg.textContent="Élève rattaché à "+c.name+".";
     await reload();
   }catch(e){assignMsg.textContent="Erreur : "+e.message;}
 };

 const comps=await FigaroCloud.table("competencies","select=code,label&order=code.asc");
 obsComp.innerHTML=comps.map(c=>`<option value="${c.code}">${c.code} — ${FigaroCloud.esc(c.label)}</option>`).join("");
 saveObs.onclick=async function(){
   obsMsg.textContent="Enregistrement…";
   try{
     await FigaroCloud.table("competency_observations","",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({
       student_id:obsStudent.value, competency_code:obsComp.value,
       acquisition_level:Number(obsLevel.value), evidence:obsEvidence.value.trim(),
       teacher_comment:obsComment.value.trim(), observed_at:new Date().toISOString().slice(0,10),
       teacher_id:me.id
     })});
     obsMsg.textContent="Observation enregistrée.";
   }catch(e){obsMsg.textContent="Erreur : "+e.message;}
 };
 await reload();
})().catch(e=>{document.getElementById("pageMsg").textContent="Erreur : "+e.message;});
</script></body></html>
