<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion FigaroMN</title>
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#1d2a38;--muted:#647481;--navy:#365975;--line:#dbe5ea;--blue:#eaf2f6;--good:#23694a;--bad:#9b3838;--warn:#8a5b00}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{background:#f9fbfc;border:1px solid var(--line);border-radius:13px;padding:15px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.light{background:#e8eef2;color:var(--ink)}input,select,textarea{width:100%;font:inherit;border:1px solid #b9c8d1;border-radius:9px;padding:10px;background:#fff}label{font-weight:700}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--blue);font-weight:800;font-size:.82rem}.msg{font-weight:800;margin-top:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#eef3f6}.hero{padding:42px 0 18px}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.3rem 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:850px){.grid,.grid2{grid-template-columns:1fr}}
</style>
</head><body>
<header class="top"><div class="shell nav"><a class="brand" href="bac-pro.html">⚓ FigaroMN</a><a href="bac-pro.html">← Retour</a></div></header>
<main class="shell"><section class="hero"><span class="pill">Suivi à distance</span><h1>Connexion FigaroMN</h1><p class="muted">Élèves et enseignant utilisent un compte personnel. Les droits sont contrôlés par Supabase et les politiques RLS.</p></section>
<div class="grid2">
<section class="card"><h2>Se connecter</h2><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required autocomplete="username"></label><br><br><label>Mot de passe<input id="loginPassword" type="password" required autocomplete="current-password"></label><br><br><button class="btn good" type="submit">Se connecter</button><div class="msg" id="loginMsg"></div></form></section>
<section class="card"><h2>Créer un compte élève</h2><p class="muted">Après l’inscription, l’enseignant rattache le compte à la bonne classe.</p><form id="signupForm"><label>Nom et prénom<input id="signupName" required></label><br><br><label>E-mail<input id="signupEmail" type="email" required></label><br><br><label>Mot de passe<input id="signupPassword" type="password" minlength="8" required></label><br><br><button class="btn" type="submit">Créer mon compte</button><div class="msg" id="signupMsg"></div></form></section>
</div></main>
<script src="supabase-config.js"></script><script src="figaromn-cloud.js"></script>
<script>
const NAVPARAMS=new URLSearchParams(location.search);
const NAVMODE=NAVPARAMS.get("mode")||"";
const NAVLEVEL=NAVPARAMS.get("level")||"";
function routeFor(p){
  if(p&&p.role==="teacher") return "enseignant.html"+(NAVLEVEL?"?level="+encodeURIComponent(NAVLEVEL):"");
  return "eleve.html"+(NAVLEVEL?"?level="+encodeURIComponent(NAVLEVEL):"");
}
(function(){
if(NAVMODE==="enseignant"){
  var signup=document.getElementById("signupForm");
  if(signup&&signup.closest("section")) signup.closest("section").style.display="none";
  var h=document.querySelector(".hero h1");
  if(h) h.textContent="Connexion Enseignant";
}else if(NAVMODE==="eleve"){
  var h=document.querySelector(".hero h1");
  if(h) h.textContent="Connexion Élève";
}

var s=FigaroCloud.session();
if(s&&s.access_token){
 FigaroCloud.profile().then(async function(p){
   if(!p)return;
   var expectedRole=NAVMODE==="enseignant"?"teacher":NAVMODE==="eleve"?"student":"";
   if(expectedRole && p.role!==expectedRole){
     await FigaroCloud.signOut();
     var msg=document.getElementById("loginMsg");
     if(msg)msg.textContent=NAVMODE==="eleve"
       ?"Une session enseignant était ouverte. Elle a été fermée : connecte-toi maintenant avec un compte élève."
       :"Une session élève était ouverte. Elle a été fermée : connecte-toi maintenant avec le compte enseignant.";
     return;
   }
   location.href=routeFor(p);
 }).catch(function(){});
}
loginForm.onsubmit=async function(e){e.preventDefault();loginMsg.textContent="Connexion…";try{await FigaroCloud.signIn(loginEmail.value.trim(),loginPassword.value);
var p=await FigaroCloud.profile();
var expectedRole=NAVMODE==="enseignant"?"teacher":NAVMODE==="eleve"?"student":"";
if(expectedRole && p && p.role!==expectedRole){
  await FigaroCloud.signOut();
  loginMsg.textContent=NAVMODE==="eleve"
    ?"Ce compte est un compte enseignant. Utilise un compte élève."
    :"Ce compte est un compte élève. Utilise le compte enseignant.";
  return;
}
location.href=routeFor(p);}catch(err){loginMsg.textContent="Connexion impossible : "+err.message;}};
signupForm.onsubmit=async function(e){e.preventDefault();signupMsg.textContent="Création…";try{var d=await FigaroCloud.signUp(signupEmail.value.trim(),signupPassword.value,signupName.value.trim());signupMsg.textContent=d&&d.access_token?"Compte créé. Connexion en cours…":"Compte créé. Vérifie ton e-mail si Supabase demande une confirmation.";if(d&&d.access_token)setTimeout(function(){location.href=routeFor({role:"student"})},600);}catch(err){signupMsg.textContent="Création impossible : "+err.message;}};
})();
</script></body></html>
